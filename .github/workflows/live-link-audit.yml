name: Live website link audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/live-link-audit.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Crawl public pages and validate links
        env:
          SITE: https://yeshuaroots.com
        run: |
          python3 - <<'PY'
          import os, re, sys, time, urllib.request, urllib.error
          from urllib.parse import urljoin, urlsplit, urldefrag
          from html.parser import HTMLParser
          from collections import deque
          from xml.etree import ElementTree
          base=os.environ['SITE'].rstrip('/')
          host=urlsplit(base).netloc
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__();self.links=[];self.ids=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'):self.ids.add(a['id'])
                  if tag in ('a','link','script','img','source') and (a.get('href') or a.get('src')):
                      self.links.append((tag,a.get('href') or a.get('src')))
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'YeshuaRootsLinkAudit/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status,r.headers.get('Content-Type',''),r.read(3000000)
          seeds=['/','/start-here','/torah','/about','/history/jewish-roots','/outreach','/prayer','/support','/members','/get-app','/get-the-app','/teachings','/library','/attributions','/news','/community','/contact']
          try:
              _,_,raw=get(base+'/sitemap.xml')
              root=ElementTree.fromstring(raw)
              seeds += [urlsplit(x.text).path for x in root.iter() if x.tag.endswith('loc') and x.text and urlsplit(x.text).netloc==host]
              print('Sitemap parsed; initial routes:',len(set(seeds)))
          except Exception as e: print('SITEMAP ERROR:',repr(e));sys.exit(1)
          queue=deque(urljoin(base,p) for p in dict.fromkeys(seeds))
          visited=set();pages={};errors=[];external=set();assets=set();checks=[]
          while queue and len(visited)<250:
              url=queue.popleft();url,_=urldefrag(url)
              if url in visited:continue
              visited.add(url)
              try:status,typ,data=get(url)
              except Exception as e:errors.append(('PAGE',url,str(e)));continue
              if status>=400:errors.append(('PAGE',url,status));continue
              if 'text/html' not in typ:continue
              parser=Page();parser.feed(data.decode('utf-8','replace'));pages[url]=parser
              for tag,href in parser.links:
                  if not href or href.startswith(('mailto:','tel:','javascript:','data:','blob:')):continue
                  target=urljoin(url,href);parsed=urlsplit(target)
                  if parsed.scheme not in ('http','https'):continue
                  clean,frag=urldefrag(target)
                  if parsed.netloc not in (host,'www.'+host):
                      external.add(clean);continue
                  if frag and tag=='a':checks.append((url,clean,frag))
                  if re.search(r'\.(?:png|jpe?g|webp|gif|svg|ico|css|js|woff2?|pdf|txt|json|xml)(?:$|\?)',parsed.path):
                      assets.add(clean)
                  elif tag=='a' and clean not in visited:queue.append(clean)
          for src,url,frag in checks:
              if url in pages and frag not in pages[url].ids:errors.append(('ANCHOR',src,url+'#'+frag))
          for url in sorted(assets):
              try:get(url)
              except Exception as e:errors.append(('ASSET',url,str(e)))
          for url in sorted(external):
              try:get(url)
              except urllib.error.HTTPError as e:
                  if e.code not in (401,403,405,429):errors.append(('EXTERNAL',url,e.code))
              except Exception as e:print('EXTERNAL UNVERIFIED:',url,str(e)[:100])
          print('RESULT pages:',len(pages),'anchors:',len(checks),'assets:',len(assets),'external:',len(external),'errors:',len(errors))
          for issue in errors:print('FAIL',*issue)
          sys.exit(1 if errors else 0)
          PY
