name: Supabase database activity check

on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-activity
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Supabase PostgREST database endpoint
        env:
          SUPABASE_URL: https://umngheuvqudwqksqzfch.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_mI4Q4CcGgFRBi7-GjGnRSg_WRoLWECd
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/")
          if [ "$status" != "200" ]; then
            echo "::error::Supabase database endpoint returned HTTP $status"
            exit 1
          fi
          echo "Supabase database endpoint responded successfully."
